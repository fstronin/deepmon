name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gjs gettext libglib2.0-bin python3 \
            gir1.2-glib-2.0 gir1.2-soup-3.0 gir1.2-secret-1
      - name: Domain, adapter and CLI tests
        run: make test
      - name: HTTP adapter tests against the mock server
        run: make test-net

  package:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper dpkg-dev libglib2.0-bin gettext \
            gjs python3 gir1.2-glib-2.0 gir1.2-soup-3.0 gir1.2-secret-1
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(dpkg-parsechangelog -S Version)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match debian/changelog version v$version" >&2
            exit 1
          fi
      - name: Build the package
        run: make deb
      - name: Verify the package contents
        run: make verify-deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: ${{ github.workspace }}/../gnome-shell-extension-deepmon_*_all.deb
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
